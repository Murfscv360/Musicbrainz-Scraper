; ============================================================================
;  Picard batch config for PicardWatch  (passed via:  picard.exe -c picard-batch.ini)
; ============================================================================
;
;  IMPORTANT — the RELIABLE way to produce this file:
;    1. Open Picard's GUI once and set the options described below.
;    2. Close Picard, then copy its config to this path:
;         %APPDATA%\MusicBrainz\Picard.ini   ->   picard-batch.ini
;    Hand-editing INI keys is version-fragile; the keys below are a documented
;    starting point for Picard 2.13 and may differ slightly on your version.
;    Verify the result by importing 3-4 sample albums (incl. a multi-disc and a
;    Various Artists compilation) before pointing PicardWatch at your real input.
;
;  What these settings achieve (the Plex contract):
;    - MOVE matched files into the library root, renamed to the Plex layout.
;    - Save cover art both embedded AND as cover.jpg.
;    - Tag Various Artists albums as a compilation so Plex groups them as ONE album.
;    - Replace Windows-illegal filename characters.
; ============================================================================

[setting]
; --- Move + rename (this is the "move perfect albums to the library" half) ---
move_files = true
move_files_to = Y:/SABNZDB/TEMP OUTPUT
rename_files = true
windows_compatibility = true
delete_empty_dirs = true

; Carry artwork / logs / cue alongside the audio when moving:
move_additional_files = true
move_additional_files_pattern = cover.* folder.* *.jpg *.png *.log *.cue *.m3u

; --- File-naming script (logically ONE expression; '/' are directory separators) ---
; Artist / Album (Year) / [disc-]track - [trackartist - ]title
file_naming_format = $if2(%albumartist%,%artist%)/%album%$if($if2(%originaldate%,%date%), \(%left($if2(%originaldate%,%date%),4)\),)/$if($gt(%totaldiscs%,1),$num(%discnumber%,1)-,)$num(%tracknumber%,2) - $if($eq(%compilation%,1),%artist% - ,)%title%
;
; If Picard rejects the   escapes above, paste this readable version into
; Options > File Naming instead (spaces are literal there):
;
;   $if2(%albumartist%,%artist%)/
;   %album%$if($if2(%originaldate%,%date%), \($left($if2(%originaldate%,%date%),4)\),)/
;   $if($gt(%totaldiscs%,1),$num(%discnumber%,1)-,)$num(%tracknumber%,2) - $if($eq(%compilation%,1),%artist% - ,)%title%

; --- Cover art (Plex reads embedded art OR cover.jpg) ---
save_images_to_tags = true
save_images_to_files = true
cover_image_filename = cover
save_only_one_front_image = true

; --- Various Artists / compilations (the classic Plex grouping fix) ---
va_name = Various Artists
; Set the iTunes compilation (TCMP) flag on VA releases via a tagger script:
; Options > Scripting > add a new script with:
;     $if($eq(%albumartist%,Various Artists),$set(compilation,1),)
; (Plex uses TCMP to group a comp as one album instead of N one-track artists.)

; --- ID3 version for MP3 (broadest Plex compatibility) ---
write_id3v23 = true
id3v2_encoding = utf-16

; --- Be a good API citizen / keep batch runs quiet ---
analyze_new_files = false
ignore_file_mbids = false

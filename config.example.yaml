# PicardWatch configuration TEMPLATE.
# Copy this file to config.yaml and fill in your values (config.yaml is git-ignored).
# Paths accept forward slashes on Windows (pathlib normalises them).

paths:
  input:    "D:/Music/Input"        # watched for new album folders (one album = one subfolder)
  extra_inputs: []                  # optional extra roots to watch (flat OR nested Genre/Artist/Album),
                                    # e.g. ["D:/MUSIC (PLEX)/Albums"]; reorganized INTO the library below
  library:  "D:/Music/Library"      # destination Plex music root; perfect albums are MOVED here
  state_db: "./state.sqlite3"       # SQLite: decisions + MB/AcoustID response cache
  log_dir:  "./logs"
  report:   "./review_report.html"  # imperfect / duplicate albums are listed here

acoustid:
  api_key:   "CHANGE_ME"            # free application key: https://acoustid.org/new-application
  min_score: 0.90                   # per-track fingerprint confidence to count a track as matched

musicbrainz:
  app_name:    "PicardWatch"
  app_version: "0.1"
  contact:     "you@example.com"    # REQUIRED by MusicBrainz; identifies your client in the User-Agent
  ssl_mode:    relaxed              # strict | relaxed | none. 'relaxed' verifies chain + hostname but
                                    # tolerates non-RFC-strict CA certs (needed when AV/proxy scans HTTPS).
  network_timeout: 30               # seconds; abort a hung HTTPS read so a flaky connection can't freeze the watcher
  retries: 2                        # retry MusicBrainz on transient connection resets (WinError 10054)
  retry_backoff: 3                  # seconds between retries

judge:
  audio_extensions: [".flac", ".mp3", ".m4a", ".ogg", ".opus", ".wav", ".wv", ".ape"]
  duration_tolerance_sec: 7         # fallback duration match when AcoustID can't ID a track
  title_similarity: 0.85            # fallback fuzzy title-match threshold (0..1)
  require_full_acoustid: false      # true = every track MUST be ID'd by fingerprint (no metadata fallback)
  max_candidates: 8                 # how many fingerprint-voted releases to score before the tag fallback
  fingerprint_workers: 4            # parallel fpcalc+AcoustID workers per album

watcher:
  stability_seconds:  20            # a folder must be untouched this long before it's processed
  poll_interval_sec:  5
  rescan_interval_sec: 300          # poll the input folder every 5 min for new drops (also wakes on FS events)
  ignore_suffixes: [".part", ".crdownload", ".!ut", ".tmp", ".filepart", ".aria2"]

picard:                             # only used if you switch the tagging engine back to Picard
  exe:        "C:/Program Files/MusicBrainz Picard/picard.exe"
  config_ini: "./picard-batch.ini"
  pause_after_lookup: 25
  pause_after_save:   10
  use_known_mbid:     true
  timeout_sec:        300

importer:                           # native tagging engine (default; no Picard required)
  dedupe: true                      # skip duplicate downloads (identical re-posts removed; dup releases flagged)
  delete_source: true               # after a successful move, delete the leftover source folder
  embed_art: false                  # also embed cover INTO each file (cover.jpg is always saved); slow on hi-res
  extra_files: [".log", ".cue"]     # also carry these alongside the audio into each album folder

# Keep the watcher alive: `run.py --supervise` restarts run.py --watch whenever it stops or hangs.
supervisor:
  keep_awake: true                  # keep the PC awake while running (the display may still sleep)
  hang_timeout: 1200                # seconds with no watcher-log activity before it's restarted
  check_interval: 30                # how often the supervisor checks on the watcher
  restart_delay: 5                  # seconds before relaunching (exponential backoff on rapid failures)

# Disk-space guard: never fill the drive while importing.
space:
  min_free_gb: 10                   # keep at least this many GB free on the library/input drive
  on_low: pause                     # pause (wait for space, auto-resume) | stop (shut down cleanly)

# Audiophile enrichment (opt-in: `python run.py --enrich [--analyze]`). Writes a per-album
# audiophile.json sidecar; only reads audio + writes the sidecar (never moves/retags/deletes).
enrich:
  sidecar: "audiophile.json"        # per-album JSON the app reads (loudness/DR/bpm/key/waveform/...)
  analyze_workers: 2                # parallel ffmpeg measurements under --analyze (raise on a big-RAM PC)

# Audio Vault catalogue (opt-in: `python run.py --catalogue [--push]`). Builds collection.json
# (artists/albums/tracks + audio quality + the audiophile.json enrichment) and pushes it.
catalogue:
  repo_dir: ""                      # local clone of the Audio Vault repo, e.g. "D:/code/Home-audio-catalogue"
  file: "collection.json"           # written to the repo root; the Audio Vault web app reads this
  name: "Audio Vault"

# Car Audio / CarPlay experience (opt-in: `python run.py --carplay`). SELF-CONTAINED + LOCAL:
# reads the M4A car-audio drive + the audiophile.json sidecars and writes CarPlay-ready .m3u8
# playlists (drive profiles + era/genre) + a sleek offline browser (index.html) INTO the drive.
# Non-destructive, no Plex, no cloud — reads audio + writes into <source>/_CarPlay only
# (with --analyze it also caches audiophile.json sidecars next to each album, on the drive).
carplay:
  source: "G:/CAR AUDIO"            # the M4A car-audio drive to curate (leave "" to use paths.library)
  out_dir: ""                       # where playlists + index.html + manifest go; "" = <source>/_CarPlay
                                    # (kept ON the drive so the whole experience travels with it)
  relative_paths: true              # track paths relative to out_dir → portable when the drive is a USB stick / phone
  analyze: false                    # measure loudness/DR with ffmpeg on this run (caches sidecars on the drive).
                                    # Also: --analyze. Run once; later runs reuse the cached measurements.
  target_lufs: -13.0                # perceived-loudness target for a noisy cabin (streaming norm is -14;
                                    # a touch louder cuts road noise). Drives per-track cabin scoring + sequencing.
  min_artist_gap: 2                 # don't repeat an artist within this many tracks in a playlist
  max_per_playlist: 500             # cap a themed playlist (keeps the most cabin-suitable; 0 = no cap)
  min_playlist_tracks: 8            # drop a themed playlist thinner than this
  top_genres: 12                    # how many genre playlists to emit (most-populous first)
  reference: false                  # OPTIONAL online extra: backfill missing genres from MusicBrainz (cached).
                                    # Off by default so the build stays fully offline. Also: --reference

plex:
  enabled: false
  host:    "http://127.0.0.1:32400"
  token:   "CHANGE_ME"              # https://support.plex.tv/articles/204059436
  music_section_id: 0               # GET {host}/library/sections?X-Plex-Token=... to find the music section key
